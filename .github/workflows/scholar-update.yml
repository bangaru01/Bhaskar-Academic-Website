
name: Update Google Scholar statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write

jobs:
  refresh-scholar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update Scholar information
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python update_scholar.py

      - name: Save updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add citations.json scholar_monitor.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Google Scholar statistics'
            git push
          fi
